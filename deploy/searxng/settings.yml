# SearXNG：Agent web_search 走 JSON API。
# 官方默认关闭 json，且 limiter 会拦服务端 fetch，两者都必须按下面改。
use_default_settings: true

general:
  instance_name: ekh-searxng

search:
  safe_search: 1
  autocomplete: ""
  default_lang: zh-CN
  formats:
    - html
    - json

server:
  secret_key: "ekh-dev-searxng-change-in-prod"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
